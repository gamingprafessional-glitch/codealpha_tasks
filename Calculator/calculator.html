<!DOCTYPE html>
<html>
    
    <head><title>Calculator(duh)</title><link href="Calculator/calculator.css" rel="Stylesheet" </head>
    
    <body>
        
        <div class="Calculator">
            <input id="Output" readonly>
            <div class="rows">
                <button onclick="display('7')" class="press">7</button>
                <button onclick="display('8')" class="press">8</button>
                <button onclick="display('9')" class="press">9</button>
                <button onclick="display('/')" class="press">/</button>
            </div>
            <div class="rows">
                <button onclick="display('4')" class="press">4</button>
                <button onclick="display('5')" class="press">5</button>
                <button onclick="display('6')" class="press">6</button>
                <button onclick="display('*')" class="press">*</button>
            </div>
            <div class="rows">
                <button onclick="display('1')" class="press">1</button>
                <button onclick="display('2')" class="press">2</button>
                <button onclick="display('3')" class="press">3</button>
                <button onclick="display('-')" class="press">-</button>
            </div>
            <div class="rows">
                <button onclick="calculateResult()" class="press">=</button>
                <button onclick="display('0')" class="press">0</button>
                <button onclick="clearDisplay()" class="press">C</button>
                <button onclick="display('+')" class="press">+</button>
            </div>

        </div>
        <script src="Calculator/Calculator.js"></script>
    </body>
</html>
